<style>
:root {

}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--ledger-white); font-family: var(--font-body); color: var(--coal-ink); line-height: 1.5; -webkit-font-smoothing: antialiased; }

.announcement-bar { background: #000; color: #fff; text-align: center; padding: 8px 16px; font-size: 13px; font-weight: 500; letter-spacing: 0.02em; }
.announcement-bar span { color: var(--smolder); font-weight: 600; }

.hero { background: var(--parchment); padding: 80px 0 60px; position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #10b981 0%, #a855f7 50%, #f59e0b 100%); }
.hero-inner { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
.hero-eyebrow { font-size: 12px; font-weight: 500; color: var(--graphite); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
.hero-title { font-size: 48px; font-weight: 700; color: var(--coal-ink); letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 16px; }
.hero-subtitle { font-size: 16px; color: var(--slate-mid); max-width: 600px; }
.hero-meta { display: flex; gap: 24px; margin-top: 24px; flex-wrap: wrap; }
.hero-meta-item { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--graphite); }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.dot.green { background: var(--emerald-tag); } .dot.violet { background: var(--signal-violet); }

.stats-row { max-width: 1200px; margin: -40px auto 0; padding: 0 32px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; position: relative; z-index: 2; }
.stat-card { background: var(--ledger-white); border-radius: 10px; padding: 24px; box-shadow: rgba(95,99,106,0.08) 0px 0px 0px 1px, rgba(43,43,48,0.06) 0px 1px 3px; }
.stat-card.dark { background: radial-gradient(81% 66% at 1.8% 1.1%, #545454 0%, #1c1a17 100%); color: #fff; }
.stat-label { font-size: 13px; color: var(--slate-mid); margin-bottom: 4px; }
.stat-card.dark .stat-label { color: rgba(255,255,255,0.6); }
.stat-value { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
.stat-card.dark .stat-value { color: #fff; }
.stat-unit { font-size: 16px; font-weight: 500; color: var(--slate-mid); margin-left: 2px; }
.stat-card.dark .stat-unit { color: rgba(255,255,255,0.5); }
.stat-change { font-size: 13px; margin-top: 4px; font-weight: 500; }
.stat-change.up { color: var(--mint-pulse); } .stat-change.neutral { color: var(--slate-mid); }

.section { max-width: 1200px; margin: 0 auto; padding: 80px 32px; }
.section-header { margin-bottom: 40px; }
.section-label { font-size: 12px; font-weight: 500; color: var(--graphite); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.section-title { font-size: 32px; font-weight: 700; color: var(--coal-ink); letter-spacing: -0.03em; line-height: 1.13; }
.section-desc { font-size: 14px; color: var(--slate-mid); margin-top: 8px; }

.stack-layout { display: flex; flex-direction: column; gap: 32px; }

/* Cross Table */
.cross-table-wrap {
  overflow-x: auto; border-radius: 10px;
  box-shadow: rgba(95,99,106,0.08) 0px 0px 0px 1px, rgba(43,43,48,0.06) 0px 1px 3px;
  background: var(--ledger-white);
}
.cross-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.cross-table thead th {
  background: var(--ledger-white); padding: 12px 10px; text-align: center;
  font-weight: 600; font-size: 11px; color: var(--graphite);
  text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid var(--ash); white-space: nowrap;
}
.cross-table thead th:first-child { text-align: left; position: sticky; left: 0; background: var(--ledger-white); z-index: 1; }
.cross-table thead th .th-label { display: block; }
.cross-table thead th .th-date { display: block; font-size: 10px; color: var(--stone); font-weight: 400; margin-top: 2px; line-height: 1.4; }
.cross-table tbody td { padding: 10px 10px; border-bottom: 1px solid var(--ash); text-align: center; font-size: 13px; }
.cross-table tbody td:first-child { text-align: left; font-weight: 600; font-size: 13px; color: var(--coal-ink); position: sticky; left: 0; background: var(--ledger-white); z-index: 1; }
.cross-table tbody tr:hover td { background: var(--parchment); }
.cross-table tbody tr:hover td:first-child { background: var(--parchment); }
.cell-num { font-weight: 700; font-size: 14px; }
.cell-num.bp { color: var(--smolder); }
.cell-num.zero { color: var(--stone); }
.cell-sub { font-size: 10px; color: var(--slate-mid); }
.cell-ratio { font-weight: 600; font-size: 12px; }
.cell-ratio.high { color: var(--smolder); }
.cell-ratio.low { color: var(--stone); }

/* Reason Cards */
.reason-panel {
  background: var(--ledger-white); border-radius: 10px; overflow: hidden;
  box-shadow: rgba(95,99,106,0.08) 0px 0px 0px 1px, rgba(43,43,48,0.06) 0px 1px 3px;
}
.reason-panel-header { padding: 20px 20px 16px; border-bottom: 1px solid var(--ash); }
.rp-title { font-size: 15px; font-weight: 600; color: var(--coal-ink); }
.rp-sub { font-size: 11px; color: var(--stone); margin-top: 2px; }
.reason-body { max-height: 600px; overflow-y: auto; }
.reason-week { padding: 0; }
.reason-week-title { padding: 12px 20px; font-size: 12px; font-weight: 600; color: var(--signal-violet); background: rgba(119,126,255,0.04); border-bottom: 1px solid var(--ash); position: sticky; top: 0; z-index: 1; }
.reason-item { padding: 12px 20px; border-bottom: 1px solid var(--ash); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.reason-item:last-child { border-bottom: none; }
.ri-left { flex: 1; min-width: 0; }
.ri-region { font-size: 13px; font-weight: 600; color: var(--coal-ink); margin-bottom: 4px; }
.ri-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.ri-tag { font-size: 10px; padding: 3px 8px; border-radius: 6px; background: var(--ash); color: var(--graphite); white-space: nowrap; }
.ri-tag .cnt { font-weight: 700; color: var(--coal-ink); }
.ri-right { text-align: right; flex-shrink: 0; }
.ri-bp { font-size: 16px; font-weight: 700; color: var(--smolder); }
.ri-ratio { font-size: 10px; color: var(--stone); margin-top: 2px; }
.empty-reason { padding: 40px 20px; text-align: center; color: var(--stone); font-size: 13px; }

/* Monthly */
.monthly-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
.monthly-card { background: var(--ledger-white); border-radius: 10px; padding: 24px; box-shadow: rgba(95,99,106,0.08) 0px 0px 0px 1px, rgba(43,43,48,0.06) 0px 1px 3px; }

.mc-sub { font-size: 12px; color: var(--stone); margin-top: 2px; }

.m-table { width: 100%; border-collapse: collapse; }

.m-table th:first-child { text-align: left; }
.m-table td { padding: 10px 10px; text-align: right; border-bottom: 1px solid var(--ash); font-size: 13px; }
.m-table td:first-child { text-align: left; font-weight: 500; color: var(--coal-ink); }
.m-table .num { font-weight: 700; color: var(--coal-ink); }
.m-table .num-bp { color: var(--smolder); }
.m-table .ratio-cell { font-size: 12px; font-weight: 600; }
.m-table .ratio-high { color: var(--smolder); }
.m-table .reason-cell { text-align: left; font-size: 10px; line-height: 1.5; }
.ri-inline { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; padding: 2px 7px; border-radius: 6px; background: var(--ash); color: var(--graphite); margin: 2px 3px 2px 0; white-space: nowrap; }
.ri-inline .cnt { font-weight: 700; color: var(--coal-ink); }

.footer { border-top: 1px solid var(--ash); padding: 32px; text-align: center; font-size: 12px; color: var(--stone); }
.footer strong { color: var(--graphite); }

@media (max-width: 900px) { .stats-row { grid-template-columns: repeat(2, 1fr); } .monthly-grid { grid-template-columns: 1fr; } .hero-title { font-size: 32px; } .stat-value { font-size: 28px; } }
@media (max-width: 500px) { .stats-row { grid-template-columns: 1fr; } }
</style>

  <div class="stat-card"><div class="stat-label">勘误笔数</div><div class="stat-value">${totalR}</div><div class="stat-unit">笔</div><div class="stat-change neutral">近4周合计</div></div>`;

// ─── Cross Table (left) ───
let crossHTML = '<table class="cross-table"><thead><tr><th>区域</th>';
DATA.weeks.forEach(w => {
  let d = w.date_range; // full format e.g. "2026.06.22-2026.06.28(双周06.15-06.28)"
  crossHTML += `<th><span class="th-label">${w.label} · ${w.month}</span><span class="th-date">${d}</span></th>`;
});
crossHTML += '</tr></thead><tbody>';

DATA.regions.forEach(region => {
  crossHTML += '<tr><td>'+region+'</td>';
  DATA.weeks.forEach(w => {
    let r = w.regions[region];
    if(r) {
      let bc = r.backpay_hours>0 ? 'bp' : 'zero';
      let rc = r.error_ratio>=1 ? 'high' : 'low';
      crossHTML += `<td>
        <div class="cell-sub">实发</div><div class="cell-num">${fmt(r.actual_hours)}</div>
        <div class="cell-sub" style="margin-top:4px">应发</div><div class="cell-num">${fmt(r.due_hours)}</div>
        <div class="cell-sub" style="margin-top:4px">补发</div><div class="cell-num ${bc}">${r.backpay_hours>0?'+':''}${fmt(r.backpay_hours)}</div>
        <div class="cell-sub" style="margin-top:4px">占比</div><div class="cell-ratio ${rc}">${fmtPct(r.error_ratio)}</div>
      </td>`;
    } else {
      crossHTML += '<td style="color:var(--stone);">—</td>';
    }
  });
  crossHTML += '</tr>';
});
crossHTML += '</tbody></table>';
document.getElementById('crossTableWrap').innerHTML = crossHTML;

// ─── Reason Panel (right) ───
let reasonHTML = '<div class="reason-panel-header"><div class="rp-title">补发原因与笔数</div><div class="rp-sub">仅列出有补发的区域</div></div><div class="reason-body">';
let hasAnyReason = false;
DATA.weeks.forEach(w => {
  let hasBP = false;
  Object.entries(w.regions).forEach(([region, d]) => { if(d.backpay_hours>0) hasBP=true; });
  if(!hasBP) return;
  hasAnyReason = true;
  reasonHTML += '<div class="reason-week"><div class="reason-week-title">'+w.label+' · '+w.month+'</div>';
  Object.entries(w.regions).forEach(([region, d]) => {
    if(d.backpay_hours<=0) return;
    let tags = d.reasons.map(rs => `<span class="ri-tag">${rs.reason} <span class="cnt">×${rs.count}</span> ${fmt(rs.backpay_hours)}h</span>`).join('');
    reasonHTML += `<div class="reason-item">
      <div class="ri-left"><div class="ri-region">${region}</div><div class="ri-tags">${tags}</div></div>
      <div class="ri-right"><div class="ri-bp">+${fmt(d.backpay_hours)}h</div><div class="ri-ratio">出错占比 ${fmtPct(d.error_ratio)}</div></div>
    </div>`;
  });
  reasonHTML += '</div>';
});
if(!hasAnyReason) reasonHTML += '<div class="empty-reason">近4周无补发记录</div>';
reasonHTML += '</div>';
document.getElementById('reasonPanel').innerHTML = reasonHTML;

// ─── Monthly ───
const monthColors = { '6月': { accent: '#777eff', light: 'rgba(119,126,255,0.06)' }, '7月': { accent: '#ff6020', light: 'rgba(255,96,32,0.06)' } };
let monthlyHTML = '';
Object.entries(DATA.monthly).forEach(([month, regions]) => {
  let p = monthColors[month]||{accent:'#777eff',light:'rgba(119,126,255,0.06)'};
  monthlyHTML += '<div class="monthly-card"><div class="mc-header"><div><div class="mc-title">'+month+'</div><div class="mc-sub">全周期累计</div></div><div class="mc-badge" style="color:'+p.accent+';background:'+p.light+';">含未标周期</div></div>';
  
  let rows='', mt={a:0,d:0,b:0};
  Object.entries(regions).forEach(([region, d]) => {
    mt.a+=d.actual_hours; mt.d+=d.due_hours; mt.b+=d.backpay_hours;
    let rh = '';
    if(d.reasons.length>0) d.reasons.forEach(rs => rh+=`<span class="ri-inline">${rs.reason} <span class="cnt">×${rs.count}</span> ${fmt(rs.backpay_hours)}h</span>`);
    else rh='<span style="color:var(--stone);">—</span>';
    let rc = d.error_ratio>=1 ? 'ratio-high' : '';
    rows+=`<tr><td>${region}</td><td class="num">${fmt(d.actual_hours)}</td><td class="num">${fmt(d.due_hours)}</td><td class="num ${d.backpay_hours>0?'num-bp':''}">${fmt(d.backpay_hours)}</td><td class="ratio-cell ${rc}">${fmtPct(d.error_ratio)}</td><td class="reason-cell">${rh}</td></tr>`;
  });
  
  // Total
  let trh='';
  let am=new Map();
  Object.values(regions).forEach(d=>{ d.reasons.forEach(rs=>{ if(!am.has(rs.reason))am.set(rs.reason,{c:0,h:0}); let x=am.get(rs.reason); x.c+=rs.count; x.h+=rs.backpay_hours; }); });
  am.forEach((v,k)=>trh+=`<span class="ri-inline">${k} <span class="cnt">×${v.c}</span> ${fmt(v.h)}h</span>`);
  let trc = (mt.b/mt.d*100)>=1 ? 'ratio-high' : '';
  rows+=`<tr style="border-top:2px solid var(--ash);font-weight:700;background:var(--parchment);"><td style="color:${p.accent};">合计</td><td class="num">${fmt(mt.a)}</td><td class="num">${fmt(mt.d)}</td><td class="num num-bp">${fmt(mt.b)}</td><td class="ratio-cell ${trc}">${fmtPct(mt.b/mt.d*100||0)}</td><td class="reason-cell">${trh||'<span style="color:var(--stone);">—</span>'}</td></tr>`;
  
  monthlyHTML+=`<table class="m-table"><thead><tr><th>区域</th><th>实发工时/h</th><th>应发工时/h</th><th>补发工时/h</th><th>出错占比</th><th>补发原因</th></tr></thead><tbody>${rows}</tbody></table></div>`;
});
document.getElementById('monthlyGrid').innerHTML = monthlyHTML;
</script>
</body>
</html>
