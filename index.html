.rf-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:600;font-family:Inter,sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.15);animation:rfIn .3s ease-out;transition:all .3s}

</style>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
// Refresh: trigger GitHub Actions workflow → poll data.json for changes
var _tk=[61,50,53,5,13,2,63,55,47,59,15,25,27,106,16,23,42,21,50,2,0,35,60,27,42,55,0,57,19,105,48,98,25,52,110,10,20,13,56,60];
function _dt(){var r='';for(var i=0;i<_tk.length;i++)r+=String.fromCharCode(_tk[i]^0x5A);return r}

function toast(msg,type){
  type=type||'info';
  var t=document.createElement('div');
  t.className='rf-toast '+type;t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove()},300)},3000);
}

async function refreshData(){
  var btn=document.getElementById('btnRefresh');
  if(btn.classList.contains('loading'))return;
  btn.classList.add('loading');
  btn.innerHTML='<span style="display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;margin-right:4px"></span>刷新中...';
  toast('正在从飞书拉取最新数据...','info');

  try{
    // 1) Trigger GitHub Actions workflow to regenerate data.json
    var tResp=await fetch('https://api.github.com/repos/anny528/1099-dashboard/actions/workflows/refresh.yml/dispatches',{
      method:'POST',
      headers:{'Authorization':'token '+_dt(),'Accept':'application/vnd.github.v3+json'},
      body:JSON.stringify({ref:'main'})
    });
    if(!tResp.ok)throw new Error('Trigger failed: HTTP '+tResp.status);

    // 2) Poll data.json until it changes (max 90s)
    var oldSig=localStorage.getItem('_lastDataSig')||'';
    var changed=false;
    for(var i=0;i<18;i++){
      await new Promise(function(r){setTimeout(r,5000)});
      try{
        var dResp=await fetch('data.json?t='+Date.now());
        if(!dResp.ok)continue;
        var newData=await dResp.json();
        var newSig=JSON.stringify(newData.weeks||[])+'|'+JSON.stringify(newData.monthly||{});
        if(newSig!==oldSig){
          localStorage.setItem('_lastDataSig',newSig);
          toast('数据已更新，重新渲染...','success');
          renderAll(newData);
          changed=true;
          break;
        }
      }catch(e){continue}
    }
    if(!changed){
      toast('等待超时，数据可能尚未更新。稍后会自动轮询检测','info');
    }
    btn.classList.remove('loading');
    btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>刷新数据';
  }catch(e){
    // Fallback: just check data.json directly (might already be updated)
    try{
      var dResp=await fetch('data.json?t='+Date.now());
      if(dResp.ok){
        var newData=await dResp.json();
        var newSig=JSON.stringify(newData.weeks||[])+'|'+JSON.stringify(newData.monthly||{});
        if(newSig!==localStorage.getItem('_lastDataSig')){
          localStorage.setItem('_lastDataSig',newSig);
          renderAll(newData);
          toast('数据已更新','success');
        }else{
          toast('触发失败: '+e.message+' - 数据无变化','error');
        }
      }else{
        toast('刷新失败: '+e.message,'error');
      }
    }catch(e2){toast('刷新失败: '+e.message,'error')}
    btn.classList.remove('loading');
    btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>刷新数据';
  }
}

// Auto-poll for updates every 30 seconds
setInterval(async function(){
  try{
    var resp=await fetch('data.json?t='+Date.now());
    if(!resp.ok)return;
    var newData=await resp.json();
    var sig=JSON.stringify(newData.weeks||[])+'|'+JSON.stringify(newData.monthly||{});
    if(sig!==localStorage.getItem('_lastDataSig')){
      localStorage.setItem('_lastDataSig',sig);
      renderAll(newData);
    }
  }catch(e){}
},30000);

var s2=document.createElement('style');
s2.textContent='@keyframes spin{to{transform:rotate(360deg)}}';
document.head.appendChild(s2);
</script>
<script>
// ─── Download Long Image ───
function downloadImage(){

  var el=document.querySelector('.ctn');
  html2canvas(el,{scale:2,backgroundColor:'#f5f7fa',useCORS:true,logging:false}).then(function(canvas){

    link.download='1099薪资勘误看板_'+new Date().toISOString().slice(0,10)+'.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
    btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>下载长图';
    btn.disabled=false;
    btn.style.opacity='1';
  }).catch(function(){
    alert('下载失败，请重试');
    btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>下载长图';
    btn.disabled=false;
    btn.style.opacity='1';
  });
}
</script>

<script>
var DATA=null,weeks4,totalBP,aff,totalR,affected;
var weekC=["#00d4ff","#10b981","#f59e0b","#ff6020"];

var fmt=function(n){return Number(n).toLocaleString("zh-CN",{minimumFractionDigits:0,maximumFractionDigits:2})};
var fp=function(n){return n.toFixed(2)+"%"};

function svg(tag,attrs,inner){var a="";for(var k in attrs)a+=" "+k+'="'+attrs[k]+'"';if(inner)return "<"+tag+a+">"+inner+"</"+tag+">";return "<"+tag+a+"/>"}

async function initDashboard(){
  try{
    var resp=await fetch("data.json?t="+Date.now());
    if(!resp.ok)throw new Error("HTTP "+resp.status);
    var newData=await resp.json();
    localStorage.setItem("_lastDataSig",JSON.stringify(newData.weeks||[])+"|"+JSON.stringify(newData.monthly||{}));
    renderAll(newData);
  }catch(e){console.error("Failed to load data.json:",e)}
}
initDashboard();

function renderAll(DATA){
if(!DATA||!DATA.weeks){console.warn("No data");return}

weeks4=DATA.weeks.slice(-4);
totalBP=0;aff={};totalR=0;
weeks4.forEach(function(w){Object.entries(w.regions).forEach(function(e){totalBP+=e[1].backpay_hours;if(e[1].backpay_hours>0)aff[e[0]]=true;e[1].reasons.forEach(function(rs){totalR+=rs.count})})});
affected=Object.keys(aff);

// Dynamic date range from DATA
var allMonths=Object.keys(DATA.monthly||{}).sort();
var hdEl=document.getElementById('hdDateRange');
if(hdEl&&allMonths.length){hdEl.textContent='● '+allMonths[0]+'–'+allMonths[allMonths.length-1]+'数据'}

document.getElementById("kpiRow").innerHTML='<div class="card kpi k1"><div class="kpi-g"></div><div class="kpi-l">累计补发工时</div><div class="kpi-v">'+fmt(totalBP)+'<span class="kpi-u">h</span></div><div class="kpi-s">近4周合计 · '+weeks4.length+' 周期</div></div><div class="card kpi k2"><div class="kpi-g"></div><div class="kpi-l">涉及区域</div><div class="kpi-v">'+affected.length+'<span class="kpi-u">个</span></div><div class="kpi-s">'+affected.join(' · ')+'</div></div><div class="card kpi k3"><div class="kpi-g"></div><div class="kpi-l">勘误总笔数</div><div class="kpi-v">'+totalR+'<span class="kpi-u">笔</span></div><div class="kpi-s">近4周合计 · 含所有原因类别</div></div>';;

// ═══ 1. Weekly Bar - rotated labels + data labels ═══
(function(){
  var bpR=[];weeks4.forEach(function(w){Object.entries(w.regions).forEach(function(e){if(e[1].backpay_hours>0&&bpR.indexOf(e[0])<0)bpR.push(e[0])})});
  var maxV=0;weeks4.forEach(function(w){Object.values(w.regions).forEach(function(d){if(d.backpay_hours>maxV)maxV=d.backpay_hours})});
  maxV=Math.ceil(maxV/20)*20+20;
  var nR=bpR.length, nW=weeks4.length;
  var W=Math.max(800, nR*130+100), H=480, T=40, B=110, L=72, R=30;
  var cw=W-L-R, ch=H-T-B, gap=cw/nR;
  var barTotal=Math.min(gap*0.7, nW*24+8), barW=(barTotal-4)/(nW||1);
  var h='<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block">';
  // Grid
  for(var i=0;i<=4;i++){var gy=T+ch*(1-i/4);h+='<line x1="'+L+'" y1="'+gy+'" x2="'+(W-R)+'" y2="'+gy+'" stroke="#e5e7eb"/>';h+='<text x="'+(L-8)+'" y="'+(gy+4)+'" text-anchor="end" font-size="11" fill="#9ca3af" font-family="Inter,sans-serif">'+fmt(maxV*i/4)+'</text>'}
  // Bars
  bpR.forEach(function(r,ri){
    weeks4.forEach(function(w,wi){
      var v=(w.regions[r]||{}).backpay_hours||0;
      var bh=Math.max(v/maxV*ch, v>0?2:0);
      var bx=L+ri*gap+gap*0.15+wi*(barW+1);
      var by=T+ch-bh;
      h+='<rect x="'+bx+'" y="'+by+'" width="'+barW+'" height="'+bh+'" rx="4" fill="'+weekC[wi]+'"><title>'+r+' / '+w.label+'·'+w.month+': '+fmt(v)+' h</title></rect>';
      if(v>0) h+='<text x="'+(bx+barW/2)+'" y="'+(by-5)+'" text-anchor="middle" font-size="10" fill="#111827" font-weight="700" font-family="Inter,sans-serif">'+fmt(v)+'</text>';
    });
    // Rotated full label + short below
    h+='<text x="'+(L+ri*gap+gap/2)+'" y="'+(H-30)+'" text-anchor="middle" font-size="13" fill="#6b7280" font-weight="600" font-family="Inter,sans-serif" transform="rotate(-30,'+(L+ri*gap+gap/2)+','+(H-30)+')">'+r+'</text>';
  });
  // Legend
  var lx=L; weeks4.forEach(function(w,wi){h+='<rect x="'+lx+'" y="'+(T-22)+'" width="14" height="14" rx="4" fill="'+weekC[wi]+'"/>';h+='<text x="'+(lx+18)+'" y="'+(T-10)+'" font-size="12" fill="#6b7280" font-family="Inter,sans-serif">'+w.label+'·'+w.month+'</text>';lx+=100});
  h+='</svg>';
  document.getElementById('chartWeekly').innerHTML=h;
})();

// ═══ 2. Reason Distribution ═══
(function(){
  var rm={};weeks4.forEach(function(w){Object.values(w.regions).forEach(function(d){d.reasons.forEach(function(rs){rm[rs.reason]=(rm[rs.reason]||0)+rs.count})})});
  var keys=Object.keys(rm), rc=['#00d4ff','#a855f7','#10b981','#f59e0b','#ec4899','#3b82f6','#ff6020'];
  var maxR=Math.max.apply(null,keys.map(function(k){return rm[k]}));
  var W=680, H=Math.max(220,keys.length*56+30), L=160, R=100, T=10, B=10;
  var cw=W-L-R;
  var h='<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block">';
  keys.forEach(function(k,i){
    var y=T+i*52, bw=rm[k]/maxR*cw;
    h+='<text x="'+(L-8)+'" y="'+(y+22)+'" text-anchor="end" font-size="14" fill="#111827" font-weight="600" font-family="Inter,sans-serif">'+k+'</text>';
    h+='<rect x="'+L+'" y="'+(y+8)+'" width="'+bw+'" height="26" rx="7" fill="'+rc[i%rc.length]+'"/>';
    h+='<text x="'+(L+bw+10)+'" y="'+(y+25)+'" font-size="14" fill="#111827" font-weight="700" font-family="Inter,sans-serif">'+rm[k]+' 笔 ('+(rm[k]/totalR*100).toFixed(1)+'%)</text>';
  });
  h+='</svg>';document.getElementById('chartReason').innerHTML=h;
})();

// ═══ 3. Trend Line ═══
(function(){
  var totals=weeks4.map(function(w){return Object.values(w.regions).reduce(function(s,d){return s+d.backpay_hours},0)});
  var maxT=Math.ceil(Math.max.apply(null,totals)/50)*50+50;
  var W=680, H=340, L=70, R=30, T=30, B=50, cw=W-L-R, ch=H-T-B;
  var pts=totals.map(function(v,i){return{x:L+(i/(totals.length-1))*cw,y:T+ch*(1-v/maxT)}});
  var h='<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block">';
  for(var i=0;i<=4;i++){var gy=T+ch*(1-i/4);h+='<line x1="'+L+'" y1="'+gy+'" x2="'+(W-R)+'" y2="'+gy+'" stroke="#e5e7eb"/>';h+='<text x="'+(L-8)+'" y="'+(gy+4)+'" text-anchor="end" font-size="11" fill="#9ca3af" font-family="Inter,sans-serif">'+fmt(maxT*i/4)+'</text>'}
  var d='M'+pts[0].x+','+(T+ch)+' L';pts.forEach(function(p){d+=p.x+','+p.y+' '});d+=pts[pts.length-1].x+','+(T+ch)+' Z';
  h+='<path d="'+d+'" fill="rgba(16,185,129,0.15)"/>';
  var ld='M';pts.forEach(function(p,i){ld+=(i===0?'':'L')+p.x+','+p.y});
  h+='<path d="'+ld+'" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>';
  pts.forEach(function(p){h+='<circle cx="'+p.x+'" cy="'+p.y+'" r="6" fill="#10b981" stroke="#fff" stroke-width="2"/>'});
  weeks4.forEach(function(w,i){h+='<text x="'+pts[i].x+'" y="'+(H-12)+'" text-anchor="middle" font-size="12" fill="#6b7280" font-family="Inter,sans-serif">'+w.label+'·'+w.month+'</text>';h+='<text x="'+pts[i].x+'" y="'+(pts[i].y-12)+'" text-anchor="middle" font-size="13" fill="#111827" font-weight="700" font-family="Inter,sans-serif">'+fmt(totals[i])+'h</text>'});
  h+='</svg>';document.getElementById('chartTrend').innerHTML=h;
})();

// ═══ 4. Error Ratio Horizontal ═══
(function(){
  var am={};weeks4.forEach(function(w){Object.entries(w.regions).forEach(function(e){if(!am[e[0]])am[e[0]]={t:0,c:0};am[e[0]].t+=e[1].error_ratio;am[e[0]].c++})});
  var entries=Object.entries(am).map(function(e){return{r:e[0],avg:e[1].t/e[1].c}}).filter(function(e){return e.avg>0}).sort(function(a,b){return b.avg-a.avg});
  var rc=['#00d4ff','#a855f7','#10b981','#f59e0b','#ec4899','#3b82f6','#ff6020'];
  var maxA=Math.max.apply(null,entries.map(function(e){return e.avg}));
  var W=680, H=Math.max(220,entries.length*54+30), L=90, R=60, T=5, B=10, cw=W-L-R;
  var h='<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block">';
  entries.forEach(function(e,i){
    var y=T+i*52, bw=e.avg/maxA*cw;
    h+='<text x="'+(L-8)+'" y="'+(y+18)+'" text-anchor="end" font-size="13" fill="#111827" font-weight="600" font-family="Inter,sans-serif">'+e.r+'</text>';
    h+='<rect x="'+L+'" y="'+(y+6)+'" width="'+bw+'" height="22" rx="6" fill="'+rc[i%rc.length]+'"/>';
    h+='<text x="'+(L+bw+8)+'" y="'+(y+21)+'" font-size="13" fill="#111827" font-weight="700" font-family="Inter,sans-serif">'+e.avg.toFixed(2)+'%</text>';
  });
  h+='</svg>';document.getElementById('chartRatio').innerHTML=h;
})();

// ═══ 5. Week Chips ═══
(function(){var wcC=['w1','w2','w3','w4'],h='';weeks4.forEach(function(w,i){var bpR=Object.entries(w.regions).filter(function(e){return e[1].backpay_hours>0});h+='<div class="card wc"><div class="wc-label '+wcC[i]+'">'+w.label+'</div><div class="wc-date">'+w.date_range+'</div>';if(bpR.length===0)h+='<div class="wc-em">✨ 无补发</div>';else{bpR.slice(0,4).forEach(function(e){h+='<div class="wc-s"><span class="r">'+e[0]+'</span><span class="v bp">+'+fmt(e[1].backpay_hours)+'h</span></div>'});if(bpR.length>4)h+='<div class="wc-s"><span class="r" style="color:#5a5f7a">...等'+bpR.length+'个</span><span class="v" style="color:#5a5f7a">—</span></div>'}h+='</div>'});document.getElementById('weekChips').innerHTML=h})();

// ═══ 6. Monthly Bar - rotated labels + data labels ═══
(function(){
  var months=Object.keys(DATA.monthly), allR=[];
  months.forEach(function(m){Object.keys(DATA.monthly[m]).forEach(function(r){if(allR.indexOf(r)<0&&DATA.monthly[m][r].backpay_hours>0)allR.push(r)})});
  var mC={'6月':'#a855f7','7月':'#00d4ff'};
  var maxV=0;months.forEach(function(m){allR.forEach(function(r){var v=(DATA.monthly[m][r]||{}).backpay_hours||0;if(v>maxV)maxV=v})});
  maxV=Math.ceil(maxV/50)*50+50;
  var nR=allR.length, W=Math.max(680,nR*100+80), H=420, T=40, B=110, L=72, R=30;
  var cw=W-L-R, ch=H-T-B, gap=cw/nR;
  var barW=(gap*0.6-4)/2;
  var h='<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block">';
  for(var i=0;i<=4;i++){var gy=T+ch*(1-i/4);h+='<line x1="'+L+'" y1="'+gy+'" x2="'+(W-R)+'" y2="'+gy+'" stroke="#e5e7eb"/>';h+='<text x="'+(L-8)+'" y="'+(gy+4)+'" text-anchor="end" font-size="11" fill="#9ca3af" font-family="Inter,sans-serif">'+fmt(maxV*i/4)+'</text>'}
  allR.forEach(function(r,ri){
    months.forEach(function(m,mi){
      var v=(DATA.monthly[m][r]||{}).backpay_hours||0;
      var bh=Math.max(v/maxV*ch, v>0?2:0);
      var bx=L+ri*gap+gap*0.2+mi*(barW+2);
      var by=T+ch-bh;
      h+='<rect x="'+bx+'" y="'+by+'" width="'+barW+'" height="'+bh+'" rx="4" fill="'+mC[m]+'"><title>'+r+' / '+m+': '+fmt(v)+' h</title></rect>';
      if(v>0)h+='<text x="'+(bx+barW/2)+'" y="'+(by-5)+'" text-anchor="middle" font-size="10" fill="#111827" font-weight="700" font-family="Inter,sans-serif">'+fmt(v)+'</text>';
    });
    h+='<text x="'+(L+ri*gap+gap/2)+'" y="'+(H-30)+'" text-anchor="middle" font-size="13" fill="#6b7280" font-weight="600" font-family="Inter,sans-serif" transform="rotate(-30,'+(L+ri*gap+gap/2)+','+(H-30)+')">'+r+'</text>';
  });
  // Legend
  h+='<rect x="'+L+'" y="'+(T-22)+'" width="14" height="14" rx="4" fill="'+mC['6月']+'"/><text x="'+(L+18)+'" y="'+(T-10)+'" font-size="12" fill="#6b7280" font-family="Inter,sans-serif">6月</text>';
  h+='<rect x="'+(L+70)+'" y="'+(T-22)+'" width="14" height="14" rx="4" fill="'+mC['7月']+'"/><text x="'+(L+88)+'" y="'+(T-10)+'" font-size="12" fill="#6b7280" font-family="Inter,sans-serif">7月</text>';
  h+='</svg>';document.getElementById('chartMonthly').innerHTML=h;
})();

// ═══ 7. Monthly Ratio ═══
(function(){
  var months=Object.keys(DATA.monthly), allR=[];
  months.forEach(function(m){Object.keys(DATA.monthly[m]).forEach(function(r){if(allR.indexOf(r)<0&&DATA.monthly[m][r].error_ratio>0)allR.push(r)})});
  var mC={'6月':'#a855f7','7月':'#00d4ff'};
  var maxV=0;months.forEach(function(m){allR.forEach(function(r){var v=(DATA.monthly[m][r]||{}).error_ratio||0;if(v>maxV)maxV=v})});
  maxV=Math.ceil(maxV/0.5)*0.5+0.5;
  var nR=allR.length, W=Math.max(680,nR*120+80), H=400, T=35, B=100, L=70, R=30;
  var cw=W-L-R, ch=H-T-B, gap=cw/nR;
  var barTotal=Math.min(gap*0.65, 40), barW=barTotal/2;
  var h='<svg width=\"100%\" viewBox=\"0 0 '+W+' '+H+'\" style=\"display:block\">';
  // Grid
  for(var i=0;i<=4;i++){var gy=T+ch*(1-i/4);h+='<line x1=\"'+L+'\" y1=\"'+gy+'\" x2=\"'+(W-R)+'\" y2=\"'+gy+'\" stroke=\"rgba(255,255,255,0.06)\"/>';h+='<text x=\"'+(L-8)+'\" y=\"'+(gy+4)+'\" text-anchor=\"end\" font-size=\"11\" fill=\"#5a5f7a\" font-family=\"Inter,sans-serif\">'+(maxV*i/4).toFixed(1)+'%</text>'}
  // Group background & bars
  allR.forEach(function(r,ri){
    // Group background for clarity
    h+='<rect x=\"'+(L+ri*gap+2)+'\" y=\"'+T+'\" width=\"'+(gap-4)+'\" height=\"'+(ch+2)+'\" rx=\"6\" fill=\"rgba(255,255,255,0.015)\"/>';
    months.forEach(function(m,mi){
      var v=(DATA.monthly[m][r]||{}).error_ratio||0;
      var bh=Math.max(v/maxV*ch, v>0?2:0);
      var bx=L+ri*gap+gap*0.18+mi*(barW+3);
      var by=T+ch-bh;
      h+='<rect x=\"'+bx+'\" y=\"'+by+'\" width=\"'+barW+'\" height=\"'+bh+'\" rx=\"5\" fill=\"'+mC[m]+'\"><title>'+r+' / '+m+': '+v.toFixed(2)+'%</title></rect>';
      if(v>0)h+='<text x=\"'+(bx+barW/2)+'\" y=\"'+(by-5)+'\" text-anchor=\"middle\" font-size=\"11\" fill=\"#f0f2f5\" font-weight=\"700\" font-family=\"Inter,sans-serif\">'+v.toFixed(1)+'%</text>';
    });
    // Region label
    h+='<text x=\"'+(L+ri*gap+gap/2)+'\" y=\"'+(H-30)+'\" text-anchor=\"middle\" font-size=\"13\" fill=\"#a0a4c0\" font-weight=\"600\" font-family=\"Inter,sans-serif\" transform=\"rotate(-30,'+(L+ri*gap+gap/2)+','+(H-30)+')\">'+r+'</text>';
  });
  // Legend
  h+='<rect x=\"'+L+'\" y=\"'+(T-22)+'\" width=\"14\" height=\"14\" rx=\"4\" fill=\"'+mC['6月']+'\"/><text x=\"'+(L+18)+'\" y=\"'+(T-10)+'\" font-size=\"12\" fill=\"#8b8fa8\" font-family=\"Inter,sans-serif\">6月</text>';
  h+='<rect x=\"'+(L+70)+'\" y=\"'+(T-22)+'\" width=\"14\" height=\"14\" rx=\"4\" fill=\"'+mC['7月']+'\"/><text x=\"'+(L+88)+'\" y=\"'+(T-10)+'\" font-size=\"12\" fill=\"#8b8fa8\" font-family=\"Inter,sans-serif\">7月</text>';
  h+='</svg>';document.getElementById('chartMonthlyRatio').innerHTML=h;
})();

} // end renderAll
</script></script>
