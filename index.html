<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1099司机薪酬看板 | 2026年1月-4月</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background:#f0f2f5; color:#1a1a2e; padding:24px; }
.header { text-align:center; margin-bottom:28px; }
.header h1 { font-size:28px; font-weight:700; color:#1a1a2e; }
.header p { font-size:14px; color:#666; margin-top:6px; }

/* KPI Cards */
.kpi-row { display:grid; grid-template-columns:repeat(5,1fr); gap:16px; margin-bottom:24px; }
.kpi-card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.08); text-align:center; }
.kpi-card .label { font-size:13px; color:#888; margin-bottom:6px; }
.kpi-card .value { font-size:26px; font-weight:700; color:#1a1a2e; }
.kpi-card .sub { font-size:12px; color:#999; margin-top:4px; }
.kpi-card.accent .value { color:#2563eb; }

/* Charts Grid */
.chart-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
.chart-grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; margin-bottom:20px; }
.chart-card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.chart-card.full { grid-column:1/-1; }
.chart-card h3 { font-size:15px; font-weight:600; color:#333; margin-bottom:12px; }
.chart-card canvas { max-height:320px; }

/* Table */
.table-card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:20px; }
.table-card h3 { font-size:15px; font-weight:600; color:#333; margin-bottom:12px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { background:#f7f8fa; padding:10px 12px; text-align:right; font-weight:600; color:#555; border-bottom:2px solid #e8e8e8; white-space:nowrap; }
th:first-child, th:nth-child(2) { text-align:left; }
td { padding:9px 12px; text-align:right; border-bottom:1px solid #f0f0f0; }
td:first-child, td:nth-child(2) { text-align:left; }
tr:hover td { background:#f7f8fa; }
.num { font-variant-numeric:tabular-nums; }
.highlight { color:#2563eb; font-weight:600; }

.footer { text-align:center; padding:16px; color:#999; font-size:12px; }

@media (max-width:900px) {
  .kpi-row { grid-template-columns:repeat(3,1fr); }
  .chart-grid, .chart-grid-3 { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<div class="header">
  <h1>1099司机薪酬看板</h1>
  <p>2026年1月 - 4月 | 数据源：实发人力成本（1099）</p>
</div>

<!-- KPI Cards -->
<div class="kpi-row">
  <div class="kpi-card">
    <div class="label">累计人次</div>
    <div class="value" id="kpi-pt">-</div>
    <div class="sub">1月-4月合计</div>
  </div>
  <div class="kpi-card accent">
    <div class="label">累计人力成本（本币）</div>
    <div class="value" id="kpi-cost">-</div>
    <div class="sub">CNY</div>
  </div>
  <div class="kpi-card">
    <div class="label">累计工时</div>
    <div class="value" id="kpi-hours">-</div>
    <div class="sub">小时</div>
  </div>
  <div class="kpi-card">
    <div class="label">次均成本</div>
    <div class="value" id="kpi-avgcost">-</div>
    <div class="sub">CNY / 人次</div>
  </div>
  <div class="kpi-card">
    <div class="label">次均工时</div>
    <div class="value" id="kpi-avghours">-</div>
    <div class="sub">小时 / 人次</div>
  </div>
</div>

<!-- Row 1: Monthly Trend + Region Pie -->
<div class="chart-grid">
  <div class="chart-card">
    <h3>月度成本与工时趋势</h3>
    <canvas id="chartTrend"></canvas>
  </div>
  <div class="chart-card">
    <h3>各区成本占比（1-4月累计）</h3>
    <canvas id="chartPie"></canvas>
  </div>
</div>

<!-- Row 2: Stacked Bar + Per-Record Avg -->
<div class="chart-grid">
  <div class="chart-card">
    <h3>各区月度成本分布（堆叠）</h3>
    <canvas id="chartStacked"></canvas>
  </div>
  <div class="chart-card">
    <h3>各区次均成本 & 次均工时对比</h3>
    <canvas id="chartBar"></canvas>
  </div>
</div>

<!-- Row 3: Region comparison bars -->
<div class="chart-grid">
  <div class="chart-card">
    <h3>各区月度人次趋势</h3>
    <canvas id="chartRegionPt"></canvas>
  </div>
  <div class="chart-card">
    <h3>各区累计成本对比</h3>
    <canvas id="chartRegionCost"></canvas>
  </div>
</div>

<!-- Detailed Table -->
<div class="table-card">
  <h3>明细数据表（月度 × 区域）</h3>
  <div style="overflow-x:auto;">
    <table id="detailTable">
      <thead>
        <tr>
          <th>月份</th><th>区域</th><th>人次</th><th>总工时</th>
          <th>次均工时</th><th>本币成本(CNY)</th><th>次均成本(CNY)</th><th>原币成本(USD)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div class="footer">数据更新时间：2026-06-05 | 1099司机实发人力成本</div>

<script>
const DATA = {
  "total": {"person_times":5431,"cost_local":41320408.46,"cost_orig":5939921.57,"hours":231644.92,"avg_cost_per_record":7608.25,"avg_hours_per_record":42.66},
  "months":["2026-01","2026-02","2026-03","2026-04"],
  "monthly":{"person_times":[1239,1259,1516,1416],"hours":[54696.61,50935.73,60922.1,65090.48],"cost":[9721495.89,9085543.38,10779701.64,11733667.55],"avg_hours_per_record":[44.15,40.46,40.19,45.97],"avg_cost_per_record":[7846.24,7216.48,7110.62,8286.49]},
  "regions":["NE 东北大区","WE 美西大区","TX 德州大区","MS 中南大区","GL 大湖大区","Ground项目部"],
  "region_stats":{"person_times":[2396,1734,652,331,165,152],"hours":[109637.84,74882.11,17190.33,13425.76,10624.33,5884.55],"cost":[19722545.23,12637373.13,3729583.65,2337996.43,1854033.18,1038876.85],"avg_hours_per_record":[45.76,43.18,26.37,40.56,64.39,38.71],"avg_cost_per_record":[8231.45,7287.99,5720.22,7063.43,11236.56,6834.72]},
  "monthly_region":[{"month":"2026-01","GL 大湖大区":423042.39,"Ground项目部":391009.89,"MS 中南大区":489930.7,"NE 东北大区":4568629.19,"TX 德州大区":762196.68,"WE 美西大区":3086687.05},{"month":"2026-02","GL 大湖大区":378307.99,"Ground项目部":209549.62,"MS 中南大区":459208.96,"NE 东北大区":4341600.92,"TX 德州大区":865606.87,"WE 美西大区":2831269.03},{"month":"2026-03","GL 大湖大区":472580.17,"Ground项目部":223976.81,"MS 中南大区":583403.12,"NE 东北大区":5245360.08,"TX 德州大区":966423.64,"WE 美西大区":3287957.83},{"month":"2026-04","GL 大湖大区":580102.64,"Ground项目部":214340.52,"MS 中南大区":805453.66,"NE 东北大区":5566955.04,"TX 德州大区":1135356.46,"WE 美西大区":3431459.23}],
  "detail_rows":[{"month":"2026-01","region":"GL 大湖大区","person_times":36,"hours":2453.48,"avg_hours":68.15,"cost":423042.39,"avg_cost":11751.18,"orig_cost":60187.0},{"month":"2026-01","region":"Ground项目部","person_times":49,"hours":2220.14,"avg_hours":45.31,"cost":391009.89,"avg_cost":7979.79,"orig_cost":55629.68},{"month":"2026-01","region":"MS 中南大区","person_times":68,"hours":2893.89,"avg_hours":42.56,"cost":489930.7,"avg_cost":7204.86,"orig_cost":69703.32},{"month":"2026-01","region":"NE 东北大区","person_times":544,"hours":25125.75,"avg_hours":46.19,"cost":4568629.19,"avg_cost":8398.22,"orig_cost":649987.08},{"month":"2026-01","region":"TX 德州大区","person_times":134,"hours":3887.17,"avg_hours":29.01,"cost":762196.68,"avg_cost":5688.03,"orig_cost":108439.09},{"month":"2026-01","region":"WE 美西大区","person_times":408,"hours":18116.18,"avg_hours":44.4,"cost":3086687.05,"avg_cost":7565.41,"orig_cost":439148.51},{"month":"2026-02","region":"GL 大湖大区","person_times":37,"hours":2171.75,"avg_hours":58.7,"cost":378307.99,"avg_cost":10224.54,"orig_cost":54293.75},{"month":"2026-02","region":"Ground项目部","person_times":39,"hours":1142.68,"avg_hours":29.3,"cost":209549.62,"avg_cost":5373.07,"orig_cost":30074.0},{"month":"2026-02","region":"MS 中南大区","person_times":67,"hours":2752.59,"avg_hours":41.08,"cost":459208.96,"avg_cost":6853.87,"orig_cost":65904.44},{"month":"2026-02","region":"NE 东北大区","person_times":550,"hours":24028.12,"avg_hours":43.69,"cost":4341600.92,"avg_cost":7893.82,"orig_cost":623094.94},{"month":"2026-02","region":"TX 德州大区","person_times":165,"hours":4024.0,"avg_hours":24.39,"cost":865606.87,"avg_cost":5246.1,"orig_cost":124229.58},{"month":"2026-02","region":"WE 美西大区","person_times":401,"hours":16816.59,"avg_hours":41.94,"cost":2831269.03,"avg_cost":7060.52,"orig_cost":406336.15},{"month":"2026-03","region":"GL 大湖大区","person_times":40,"hours":2687.87,"avg_hours":67.2,"cost":472580.17,"avg_cost":11814.5,"orig_cost":68264.31},{"month":"2026-03","region":"Ground项目部","person_times":34,"hours":1283.46,"avg_hours":37.75,"cost":223976.81,"avg_cost":6587.55,"orig_cost":32353.5},{"month":"2026-03","region":"MS 中南大区","person_times":90,"hours":3432.95,"avg_hours":38.14,"cost":583403.12,"avg_cost":6482.26,"orig_cost":84272.71},{"month":"2026-03","region":"NE 东北大区","person_times":684,"hours":29255.22,"avg_hours":42.77,"cost":5245360.08,"avg_cost":7668.66,"orig_cost":757693.43},{"month":"2026-03","region":"TX 德州大区","person_times":186,"hours":4518.17,"avg_hours":24.29,"cost":966423.64,"avg_cost":5195.83,"orig_cost":139600.11},{"month":"2026-03","region":"WE 美西大区","person_times":482,"hours":19745.23,"avg_hours":40.97,"cost":3287957.83,"avg_cost":6821.49,"orig_cost":474946.24},{"month":"2026-04","region":"GL 大湖大区","person_times":52,"hours":3311.23,"avg_hours":63.68,"cost":580102.64,"avg_cost":11155.82,"orig_cost":83837.13},{"month":"2026-04","region":"Ground项目部","person_times":30,"hours":1238.27,"avg_hours":41.28,"cost":214340.52,"avg_cost":7144.68,"orig_cost":30976.75},{"month":"2026-04","region":"MS 中南大区","person_times":106,"hours":4346.33,"avg_hours":41.0,"cost":805453.66,"avg_cost":7598.62,"orig_cost":116405.13},{"month":"2026-04","region":"NE 东北大区","person_times":618,"hours":31228.75,"avg_hours":50.53,"cost":5566955.04,"avg_cost":9008.02,"orig_cost":804543.03},{"month":"2026-04","region":"TX 德州大区","person_times":167,"hours":4760.99,"avg_hours":28.51,"cost":1135356.46,"avg_cost":6798.54,"orig_cost":164083.08},{"month":"2026-04","region":"WE 美西大区","person_times":443,"hours":20204.11,"avg_hours":45.61,"cost":3431459.23,"avg_cost":7745.96,"orig_cost":495918.61}]
};

const REGION_COLORS = {
  'NE 东北大区': '#2563eb', 'WE 美西大区': '#f59e0b', 'TX 德州大区': '#10b981',
  'MS 中南大区': '#8b5cf6', 'GL 大湖大区': '#ec4899', 'Ground项目部': '#06b6d4'
};

const FMTC = n => '¥' + n.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2});
const FMTU = n => '$' + n.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2});
const FMTN = n => n.toLocaleString('en-US');
const FMTH = n => n.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2}) + 'h';

// KPI
document.getElementById('kpi-pt').textContent = FMTN(DATA.total.person_times);
document.getElementById('kpi-cost').textContent = FMTC(DATA.total.cost_local);
document.getElementById('kpi-hours').textContent = FMTN(DATA.total.hours);
document.getElementById('kpi-avgcost').textContent = FMTC(DATA.total.avg_cost_per_record);
document.getElementById('kpi-avghours').textContent = FMTH(DATA.total.avg_hours_per_record);

// Chart defaults
Chart.defaults.font.family = "-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif";
Chart.defaults.font.size = 12;

// 1. Trend: dual axis - cost bars + hours line
new Chart(document.getElementById('chartTrend'), {
  type:'bar',
  data:{
    labels: DATA.months.map(m => m.slice(5)+'月'),
    datasets:[
      {label:'本币成本 (CNY)',data:DATA.monthly.cost,backgroundColor:'rgba(37,99,235,0.7)',borderColor:'#2563eb',borderWidth:2,borderRadius:6,yAxisID:'y'},
      {label:'总工时 (h)',data:DATA.monthly.hours,type:'line',borderColor:'#f59e0b',backgroundColor:'rgba(245,158,11,0.1)',borderWidth:2.5,fill:true,tension:0.3,yAxisID:'y1'}
    ]
  },
  options:{
    responsive:true,maintainAspectRatio:true,
    plugins:{legend:{position:'bottom',labels:{usePointStyle:true,padding:20}}},
    scales:{
      y:{position:'left',title:{display:true,text:'CNY'},ticks:{callback:v=>'¥'+(v/1000000).toFixed(1)+'M'},grid:{color:'rgba(0,0,0,0.05)'}},
      y1:{position:'right',title:{display:true,text:'Hours'},grid:{drawOnChartArea:false}}
    }
  }
});

// 2. Pie
const pieLabels = DATA.regions;
const pieData = DATA.region_stats.cost;
const pieColors = DATA.regions.map(r=>REGION_COLORS[r]);
new Chart(document.getElementById('chartPie'), {
  type:'doughnut',
  data:{
    labels:pieLabels,
    datasets:[{data:pieData,backgroundColor:pieColors,borderWidth:2,borderColor:'#fff'}]
  },
  options:{
    responsive:true,maintainAspectRatio:true,
    plugins:{
      legend:{position:'bottom',labels:{usePointStyle:true,padding:14,font:{size:11}}},
      tooltip:{callbacks:{label:ctx=>ctx.label+': '+FMTC(ctx.raw)+' ('+(ctx.raw/DATA.total.cost_local*100).toFixed(1)+'%)'}}
    }
  }
});

// 3. Stacked bar
const stackedDatasets = DATA.regions.map(r=>({
  label:r,data:DATA.monthly_region.map(m=>m[r]||0),backgroundColor:REGION_COLORS[r],borderRadius:2
}));
new Chart(document.getElementById('chartStacked'), {
  type:'bar',
  data:{labels:DATA.months.map(m=>m.slice(5)+'月'),datasets:stackedDatasets},
  options:{
    responsive:true,maintainAspectRatio:true,
    plugins:{legend:{position:'bottom',labels:{usePointStyle:true,padding:12,font:{size:10}}}},
    scales:{x:{stacked:true},y:{stacked:true,title:{display:true,text:'CNY'},ticks:{callback:v=>'¥'+(v/1000000).toFixed(1)+'M'}}}
  }
});

// 4. Bar: avg cost & avg hours per record by region
new Chart(document.getElementById('chartBar'), {
  type:'bar',
  data:{
    labels:pieLabels,
    datasets:[
      {label:'次均成本 (CNY)',data:DATA.region_stats.avg_cost_per_record,backgroundColor:'rgba(37,99,235,0.6)',borderColor:'#2563eb',borderWidth:1,borderRadius:6,yAxisID:'y'},
      {label:'次均工时 (h)',data:DATA.region_stats.avg_hours_per_record,type:'line',borderColor:'#ec4899',backgroundColor:'rgba(236,72,153,0.1)',borderWidth:2.5,fill:false,tension:0.3,pointRadius:5,pointBackgroundColor:'#ec4899',yAxisID:'y1'}
    ]
  },
  options:{
    responsive:true,maintainAspectRatio:true,
    plugins:{legend:{position:'bottom',labels:{usePointStyle:true,padding:20}}},
    scales:{
      y:{position:'left',title:{display:true,text:'CNY'},ticks:{callback:v=>'¥'+v.toLocaleString()},grid:{color:'rgba(0,0,0,0.05)'}},
      y1:{position:'right',title:{display:true,text:'Hours'},grid:{drawOnChartArea:false}}
    }
  }
});

// 5. Region person-times trend
const ptDatasets = DATA.regions.map(r=>({
  label:r,data:getMonthlyRegionPt(r),borderColor:REGION_COLORS[r],backgroundColor:'transparent',borderWidth:2,tension:0.3,pointRadius:4
}));
function getMonthlyRegionPt(region) {
  return DATA.detail_rows.filter(r=>r.region===region).sort((a,b)=>a.month.localeCompare(b.month)).map(r=>r.person_times);
}
new Chart(document.getElementById('chartRegionPt'), {
  type:'line',
  data:{labels:DATA.months.map(m=>m.slice(5)+'月'),datasets:ptDatasets},
  options:{
    responsive:true,maintainAspectRatio:true,
    plugins:{legend:{position:'bottom',labels:{usePointStyle:true,padding:12,font:{size:10}}}},
    scales:{y:{title:{display:true,text:'人次'},beginAtZero:true}}
  }
});

// 6. Region total cost comparison
new Chart(document.getElementById('chartRegionCost'), {
  type:'bar',
  data:{
    labels:pieLabels,
    datasets:[{label:'累计成本 (CNY)',data:DATA.region_stats.cost,backgroundColor:pieColors,borderRadius:8,borderWidth:0}]
  },
  options:{
    indexAxis:'y',
    responsive:true,maintainAspectRatio:true,
    plugins:{legend:{display:false}},
    scales:{x:{ticks:{callback:v=>'¥'+(v/1000000).toFixed(1)+'M'}}}
  }
});

// Detail table
const tbody = document.querySelector('#detailTable tbody');
DATA.detail_rows.forEach(r=>{
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${r.month}</td><td>${r.region}</td><td class="num">${FMTN(r.person_times)}</td><td class="num">${FMTH(r.hours)}</td><td class="num">${r.avg_hours}h</td><td class="num highlight">${FMTC(r.cost)}</td><td class="num">${FMTC(r.avg_cost)}</td><td class="num">${FMTU(r.orig_cost)}</td>`;
  tbody.appendChild(tr);
});
</script>
</body>
</html>
