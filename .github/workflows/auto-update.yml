name: Auto Update Dashboard

on:
  schedule:
    # 每小时的第 0 分钟运行
    - cron: "0 * * * *"
  # 也支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch & Build
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python build_html.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # 先尝试拉取远程变更（rebase 模式），避免推送冲突
          git pull --rebase --autostash origin main || git pull --rebase origin main
          git diff --staged --quiet || (git commit -m "🤖 自动更新看板 [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)
