name: Auto Update Dashboard

on:
  schedule:
    # 每小时的第 0 分钟运行
    - cron: "0 * * * *"
  # 也支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch & Build
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python build_html.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # 强制采用本地版本（重新生成的 HTML 永远以本地为准）
          # 先尝试 rebase 拉取远程，如果冲突则用 ours 策略
          git pull --rebase --strategy-option=theirs --autostash origin main || true
          git status
          # 检查 rebase 是否完成（没有 unmerged 文件）
          if git diff --staged --quiet && [ -z "$(git ls-files -u)" ]; then
            # 没有冲突，直接提交推送
            git diff --staged --quiet || git add index.html
            if ! git diff --staged --quiet; then
              git commit -m "🤖 自动更新看板 [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            fi
            git push origin main
          else
            echo "❌ Rebase conflict, aborting and force pushing local version"
            git rebase --abort || true
            git checkout --theirs index.html 2>/dev/null || git checkout index.html
            git add index.html
            git commit -m "🤖 自动更新看板 [$(date -u +'%Y-%m-%d %H:%M UTC')]" --allow-empty || true
            git push origin main --force-with-lease
          fi
