name: Refresh Correction Dashboard

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [refresh-correction]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Lark Access Token
        id: auth
        run: |
          RESP=$(curl -s -X POST 'https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"app_id":"${{ secrets.LARK_APP_ID }}","app_secret":"${{ secrets.LARK_APP_SECRET }}"}')
          CODE=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('code','?'))")
          echo "Auth code: $CODE"
          TOKEN=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['tenant_access_token'])")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Fetch Records and Build
        env:
          LARK_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, re, os

          BASE = "HdrmbvZ6dawTVrs2L6YcdB22nKl"
          TABLE = "tblWfNL6VuMjKVwG"
          TOKEN = os.environ["LARK_TOKEN"]

          all_items = []
          page_token = None
          while True:
              url = f"https://open.feishu.cn/open-apis/bitable/v1/apps/{BASE}/tables/{TABLE}/records?page_size=20"
              if page_token:
                  url += f"&page_token={page_token}"
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {TOKEN}"})
              resp = json.loads(urllib.request.urlopen(req).read())
              if resp.get("code") != 0:
                  print(f"API error: code={resp.get('code')}, msg={resp.get('msg')}")
                  break
              items = resp["data"]["items"]
              print(f"  page: {len(items)} records (total so far: {len(all_items)+len(items)})")
              all_items.extend(items)
              if not resp["data"].get("has_more"):
                  break
              page_token = resp["data"].get("page_token")

          print(f"Total records: {len(all_items)}")

          def pv(v):
              if v is None: return 0.0
              s = str(v).strip()
              if s in ('', '-'): return 0.0
              return float(s.replace(',', ''))

          FIELD_ORDER = [
              '周期','月份','未及时录入指纹','打卡机/系统故障 (1)',
              '大区','补发工时/h','本期实发工时/h','本期应发工时/h',
              '未及时录入指纹 (1)','员工漏打卡 (1)',
              '打卡机/系统故障','时间区间',
              '出错占比率','员工漏打卡',
              '考勤专员数据差异 (1)','考勤专员数据差异'
          ]
          rows = [[r['fields'].get(k) for k in FIELD_ORDER] for r in all_items]

          wk_keys = []
          for r in rows:
              dr = (r[11] or '').strip()
              mo = (r[1] or '').strip()
              key = (dr, mo)
              if dr and key not in wk_keys: wk_keys.append(key)

          weeks = []
          period_by_month = {}  # track auto-generated labels per month
          regions_set = set()
          for (wk, mo) in wk_keys:
              wk_rows = [r for r in rows if (r[11] or '').strip() == wk and (r[1] or '').strip() == mo]
              # Period: use existing label, else auto-generate per-month sequence
              wk_periods = set((r[0] or '').strip() for r in wk_rows if (r[0] or '').strip())
              if wk_periods:
                  period = sorted(wk_periods)[0]
                  period_by_month[mo] = max(period_by_month.get(mo, 0), int(period[1:]) if period.startswith('W') and len(period) > 1 and period[1:].isdigit() else 1)
              else:
                  n = period_by_month.get(mo, 0) + 1
                  period = f'W{n}'
                  period_by_month[mo] = n
              month = mo
              regs = {}
              for r in wk_rows:
                  rg = (r[4] or '').strip()
                  if not rg: continue
                  regions_set.add(rg)
                  reasons = []
                  if pv(r[2]) > 0: reasons.append({'reason':'未及时录入指纹','count':int(pv(r[2])),'backpay_hours':pv(r[8])})
                  if pv(r[10]) > 0: reasons.append({'reason':'打卡机/系统故障','count':int(pv(r[10])),'backpay_hours':pv(r[3])})
                  if pv(r[13]) > 0: reasons.append({'reason':'员工漏打卡','count':int(pv(r[13])),'backpay_hours':pv(r[9])})
                  if pv(r[15]) > 0: reasons.append({'reason':'考勤专员数据差异','count':int(pv(r[15])),'backpay_hours':pv(r[14])})
                  ratio = float((r[12] or '0%').strip().replace('%',''))
                  bp = pv(r[5]) or sum(rs['backpay_hours'] for rs in reasons)
                  regs[rg] = {'actual_hours':pv(r[6]),'due_hours':pv(r[7]),'backpay_hours':bp,'error_ratio':ratio,'reasons':reasons}
              weeks.append({'label':period,'month':month,'date_range':wk,'regions':regs})

          monthly = {}
          for w in weeks:
              m = w['month']
              if m not in monthly: monthly[m] = {}
              for rg, d in w['regions'].items():
                  if rg not in monthly[m]:
                      monthly[m][rg] = {'actual_hours':0,'due_hours':0,'backpay_hours':0,'reasons':[]}
                  monthly[m][rg]['actual_hours'] += d['actual_hours']
                  monthly[m][rg]['due_hours'] += d['due_hours']
                  monthly[m][rg]['backpay_hours'] += d['backpay_hours']
                  for rs in d['reasons']:
                      found = False
                      for mrs in monthly[m][rg]['reasons']:
                          if mrs['reason'] == rs['reason']:
                              mrs['count'] += rs['count']
                              mrs['backpay_hours'] += rs['backpay_hours']
                              found = True
                      if not found: monthly[m][rg]['reasons'].append(dict(rs))
              for rg in monthly[m]:
                  d2 = monthly[m][rg]
                  d2['error_ratio'] = round(d2['backpay_hours']/d2['due_hours']*100,2) if d2['due_hours']>0 else 0

          data = {'weeks':weeks,'monthly':monthly,'regions':sorted(regions_set)}
          with open('data.json','w',encoding='utf-8') as f: json.dump(data, f, ensure_ascii=False)
          print(f'Written data.json')

          tc = sum(sum(rs['count'] for rs in d['reasons']) for w in weeks for d in w['regions'].values())
          tb = sum(d['backpay_hours'] for w in weeks for d in w['regions'].values())
          print(f'Summary: {len(rows)} records, {len(weeks)} weeks, {tc} corrections, {tb:.1f}h backpay')
          PYEOF

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes (data identical)"
          else
            git commit -m "🔄 手动刷新看板 [$(date +%Y-%m-%d)]"
            git push
            echo "Pushed! GitHub Pages will auto-deploy."
          fi
