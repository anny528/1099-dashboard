<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 飞书 SSO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-card h1 {
      font-size: 24px;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    .login-card .subtitle {
      font-size: 14px;
      color: #999;
      margin-bottom: 32px;
    }
    .feishu-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #3370ff;
      color: #fff;
      border: none;
      padding: 14px 36px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .feishu-btn:hover {
      background: #2860e0;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(51, 112, 255, 0.3);
    }
    .feishu-btn:active {
      transform: translateY(0);
    }
    .feishu-icon {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #ddd;
      border-top-color: #3370ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-msg {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .status-msg.error {
      background: #fef0f0;
      color: #f56c6c;
      border: 1px solid #fde2e2;
      display: block;
    }
    .status-msg.info {
      background: #f0f7ff;
      color: #3370ff;
      border: 1px solid #d0e3ff;
      display: block;
    }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>薪酬看板系统</h1>
    <p class="subtitle">请使用飞书账号登录</p>

    <div id="loading-area" style="display:none;">
      <div class="loading"></div>
      <p style="margin-top:12px;color:#999;font-size:14px;" id="loading-text">正在验证登录状态...</p>
    </div>

    <div id="login-area">
      <button class="feishu-btn" id="login-btn">
        <svg class="feishu-icon" viewBox="0 0 1024 1024">
          <path d="M512 64C264.8 64 64 264.8 64 512s200.8 448 448 448 448-200.8 448-448S759.2 64 512 64zm-96.8 668.8c-86.4 0-156.8-70.4-156.8-156.8 0-72 48-128 120-144-8-16-12-32-12-48 0-56 44.8-100.8 100.8-100.8 24 0 44.8 8 60.8 20.8 20.8-40 64-68 112-68 68 0 124.8 56 124.8 124.8 0 12-1.6 24-4.8 36 56 16 97.6 68 97.6 129.6 0 74.4-60.8 135.2-135.2 135.2H415.2z"/>
        </svg>
        飞书登录
      </button>
    </div>

    <div class="status-msg" id="status-msg"></div>

    <div class="footer">飞书 SSO + JWT 认证 &middot; v1.0</div>
  </div>

  <!-- 配置文件 -->
  <script src="config.js"></script>

  <script>
    'use strict';

    var apiBase = window.API_BASE || '';
    var statusMsg = document.getElementById('status-msg');
    var loadingArea = document.getElementById('loading-area');
    var loginArea = document.getElementById('login-area');
    var loadingText = document.getElementById('loading-text');

    // ==================== URL 参数处理 ====================

    var urlParams = new URLSearchParams(location.search);
    var tokenParam = urlParams.get('token');
    var errorParam = urlParams.get('error');

    // 1. 如果 URL 中有 token（从 OAuth 回调跳来），存储 token
    if (tokenParam) {
      localStorage.setItem('feishu_token', tokenParam);
      // 清除 URL 中的 token 参数
      var cleanUrl = location.pathname;
      history.replaceState(null, '', cleanUrl);
      loadingArea.style.display = 'block';
      loginArea.style.display = 'none';
      loadingText.textContent = '登录成功，正在跳转...';
      // 验证 token 并跳转
      redirectAfterLogin();
    }
    // 2. 如果 URL 中有 error
    else if (errorParam) {
      showError(getErrorMessage(errorParam, urlParams.get('msg')));
    }
    // 3. 检查是否已登录
    else {
      checkExistingLogin();
    }

    // ==================== 登录按钮 ====================

    document.getElementById('login-btn').addEventListener('click', function () {
      if (!apiBase) {
        showError('后端地址未配置，请联系管理员');
        return;
      }
      // 跳转到后端的飞书 OAuth 入口
      window.location.href = apiBase + '/api/auth/feishu';
    });

    // ==================== 函数 ====================

    function checkExistingLogin() {
      var token = localStorage.getItem('feishu_token');
      if (!token) {
        // 未登录，显示登录按钮
        loadingArea.style.display = 'none';
        loginArea.style.display = 'block';
        return;
      }

      // 有 token，验证是否有效
      loadingArea.style.display = 'block';
      loginArea.style.display = 'none';
      loadingText.textContent = '正在验证登录状态...';

      fetch(apiBase + '/api/auth/me', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(function (res) {
        if (res.ok) return res.json();
        // token 无效，清除并显示登录按钮
        localStorage.removeItem('feishu_token');
        loadingArea.style.display = 'none';
        loginArea.style.display = 'block';
        return null;
      })
      .then(function (user) {
        if (user) {
          redirectAfterLogin();
        }
      })
      .catch(function (err) {
        console.error('验证失败:', err);
        loadingArea.style.display = 'none';
        loginArea.style.display = 'block';
        showInfo('无法连接认证服务，请检查网络');
      });
    }

    function redirectAfterLogin() {
      var token = localStorage.getItem('feishu_token');
      if (!token) {
        loadingArea.style.display = 'none';
        loginArea.style.display = 'block';
        return;
      }

      fetch(apiBase + '/api/auth/me', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(function (res) { return res.json(); })
      .then(function (user) {
        console.log('用户信息:', user);
        var pages = user.pages || [];

        // 优先跳转到用户有权访问的第一个页面
        // 优先顺序: admin.html → index.html → dashboard.html → 第一个可用页面
        var target = null;
        if (pages.indexOf('admin.html') !== -1) {
          target = 'admin.html';
        } else if (pages.indexOf('index.html') !== -1) {
          target = 'index.html';
        } else if (pages.indexOf('dashboard.html') !== -1) {
          target = 'dashboard.html';
        } else if (pages.length > 0) {
          target = pages[0];
        }

        if (target) {
          window.location.href = target;
        } else {
          showError('您没有被分配任何可访问的页面，请联系管理员');
        }
      })
      .catch(function (err) {
        console.error('获取用户信息失败:', err);
        showError('登录验证失败，请重试');
        loadingArea.style.display = 'none';
        loginArea.style.display = 'block';
      });
    }

    function getErrorMessage(error, msg) {
      var messages = {
        'state_mismatch': '安全验证失败，请重试',
        'no_code': '授权码缺失，请重试',
        'no_permission': '您的飞书账号没有访问权限，请联系管理员添加',
        'auth_failed': '认证失败: ' + (msg || '未知错误')
      };
      return messages[error] || ('登录失败: ' + error);
    }

    function showError(msg) {
      statusMsg.className = 'status-msg error';
      statusMsg.textContent = msg;
      loadingArea.style.display = 'none';
      loginArea.style.display = 'block';
    }

    function showInfo(msg) {
      statusMsg.className = 'status-msg info';
      statusMsg.textContent = msg;
    }
  </script>
</body>
</html>
